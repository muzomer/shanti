version: "3"

tasks:
  build-shanti:
    desc: "Build the shanti binary that demo tapes drive"
    cmds:
      - cargo build --release

  setup-demo-fixtures:
    desc: "Set up local, offline fixtures for demos/features.tape"
    dir: ./demos/
    cmds:
      - ./fixtures/setup-local.sh

  setup-demo-fixtures-github:
    desc: "Set up the GitHub-backed fixtures for demos/create-from-pr.tape (needs network + SSH auth)"
    dir: ./demos/
    cmds:
      - ./fixtures/setup-github.sh

  create-demo:
    desc: "Regenerate demos/features.gif (offline)"
    dir: ./demos/
    deps:
      - build-shanti
      - setup-demo-fixtures
    env:
      PATH: "{{.ROOT_DIR}}/target/release:{{.PATH}}"
    cmd: vhs features.tape

  create-pr-demo:
    desc: "Regenerate demos/create-from-pr.gif (needs network + SSH auth)"
    dir: ./demos/
    deps:
      - build-shanti
      - setup-demo-fixtures-github
    env:
      PATH: "{{.ROOT_DIR}}/target/release:{{.PATH}}"
    cmd: vhs create-from-pr.tape
